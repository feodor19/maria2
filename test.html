<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maria ❤️ Teo</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #3a0f2d);
        color: white;
        text-align: center;
        overflow: hidden;
    }

    .container {
        padding: 40px 20px;
        position: relative;
        z-index: 2;
    }

    h1 {
        font-size: 40px;
    }

    h2 {
        font-weight: normal;
        color: #ffb6c1;
    }

    img {
        width: 280px;
        border-radius: 20px;
        box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
        margin: 30px 0;
    }

    button {
        padding: 15px 35px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin: 15px;
        transition: 0.3s;
    }

    #yes {
        background: #ff4d6d;
        color: white;
        box-shadow: 0 0 15px #ff4d6d;
    }

    #yes:hover {
        transform: scale(1.1);
    }

    #no {
        background: #444;
        color: white;
        position: absolute;
    }

    .heart {
        position: fixed;
        font-size: 24px;
        animation: floatUp 4s linear infinite;
        opacity: 0.8;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh); opacity: 1; }
        100% { transform: translateY(-10vh); opacity: 0; }
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1;
    }
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">
    <h1>Maria... 💖</h1>
    <h2>De când te-am cunoscut, viața mea e mai frumoasă.</h2>

    <img src="poza.jpg" alt="Noi doi">

    <p style="font-size:20px;">
        Am o întrebare foarte importantă pentru tine...
    </p>

    <h1>Vrei să fii a mea de Valentine's Day? 🌹</h1>

    <button id="yes" onclick="sayYes()">DA ❤️</button>
    <button id="no" onmouseover="moveButton()">NU 😅</button>
</div>

<script>
function moveButton() {
    const button = document.getElementById("no");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    button.style.left = x + "px";
    button.style.top = y + "px";
}

function sayYes() {
    document.body.innerHTML += "<h1 style='position:relative;z-index:2;margin-top:20px;'>TE IUBESC 🥰❤️</h1>";
    startConfetti();
    startHearts();
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 4000);
    }, 300);
}

// Confetti
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function startConfetti() {
    for (let i = 0; i < 150; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 6 + 4,
            d: Math.random() * 50,
            color: "hsl(" + Math.random() * 360 + ", 100%, 50%)",
            tilt: Math.floor(Math.random() * 10) - 10
        });
    }
    drawConfetti();
}

function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confetti.forEach((c, i) => {
        ctx.beginPath();
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.r, c.r);
    });

    updateConfetti();
    requestAnimationFrame(drawConfetti);
}

function updateConfetti() {
    confetti.forEach(c => {
        c.y += 2;
        if (c.y > canvas.height) {
            c.y = -10;
        }
    });
}
</script>

</body>
</html>
